<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7f00ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Facet 1: Top Bar (Electric Cyan to Sky Blue) -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Facet 2: Left Spine (Blue to Royal Indigo) -->
    <linearGradient id="facetSpine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Facet 3: Base & Riser (Purple to Violet) -->
    <linearGradient id="facetBase" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Facet 4: Crossbar Core (Electric Magenta to Cyan) -->
    <linearGradient id="facetCrossbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge (Curved Squircle with subtle gradient border) -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Subtle Ambient Glow -->
  <circle cx="50" cy="50" r="28" fill="#4facfe" opacity="0.12" filter="url(#coreGlow)" />

  <!-- Tech Geometric G Symbol -->
  <!-- Top Bar: Angled Tech Cantilever -->
  <polygon points="76,22 34,22 24,32 40,40 76,40" fill="url(#facetTop)" />

  <!-- Left Spine: Solid Beveled Pillar -->
  <polygon points="24,32 20,44 20,60 32,76 44,66 34,54 34,44 40,40" fill="url(#facetSpine)" />

  <!-- Bottom Base: Angular Foundation -->
  <polygon points="32,76 74,76 78,66 44,66" fill="url(#facetBase)" />

  <!-- Dynamic Riser & Crossbar: Upward Arrowhead Dynamic -->
  <polygon points="78,66 78,46 52,46 48,54 66,54 66,66" fill="url(#facetCrossbar)" />

  <!-- Central Tech Diamond Accent Node -->
  <polygon points="52,46 58,40 64,46 58,52" fill="#ffffff" opacity="0.9" filter="url(#coreGlow)" />
</svg>